version: '3.8'

services:
  bot:
    build: .
    restart: always
    env_file:
      - .env
    volumes:
      - /usr/local/jester/JesterAI/media:/usr/local/jester/JesterAI/media
    environment:
      DB_HOST: 172.17.0.1
      PYTHONUNBUFFERED: 1

  api:
      build:
        context: .
        dockerfile: src/core/services/api/Dockerfile
      container_name: jester_tma_api
      ports:
        - "8000:8000"
      env_file: .env
      extra_hosts:
        - "host.docker.internal:host-gateway"
      restart: always