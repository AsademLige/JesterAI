services:
  api:
    volumes:
      - ./src:/app/src
    environment:
      - DEBUG=1
      - ENVIRONMENT=development

  bot:
    volumes:
      - ./media:/usr/local/jester/JesterAI/media

  # frontend_fighting:
  #   image: python:3.11-alpine
  #   working_dir: /app
  #   volumes:
  #     - ./src/core/services/mini_app_fighting:/app
  #   ports:
  #     - "5173:5173"
  #   command: python3 -m http.server 5173
  #   restart: unless-stopped

  frontend_fishing:
    image: python:3.11-alpine
    working_dir: /app
    volumes:
      - ./src/core/services/mini_app_fishing:/app
    ports:
      - "5173:5173"
    command: python3 -m http.server 5173
    restart: unless-stopped

  # frontend_gladiators:
  #   image: python:3.11-alpine
  #   working_dir: /app
  #   volumes:
  #     - ./src/core/services/mini_app_gladiators:/app
  #   ports:
  #     - "5175:5173"
  #   command: python3 -m http.server 5173
  #   restart: unless-stopped

  frontend-api:
    image: alpine:latest
    restart: unless-stopped
    volumes:
      - .:/app
    command: >
      sh -c "apk add --no-cache openssh-client grep &&  ssh -t -t -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 80:api:8000 serveo.net 2>&1 |  tee /dev/stderr |  grep --line-buffered -Eo 'https://[a-zA-Z0-9.-]+\.serveousercontent\.com' > /app/api_url.txt"
    depends_on:
      - api

  env-watcher:
    image: alpine:latest
    restart: unless-stopped
    volumes:
      - .:/app
    command: >
      sh -c "LAST=none; while true; do if [ -s /app/api_url.txt ]; then CUR=$$(head -n 1 /app/api_url.txt); if [ -n $$CUR ] && [ $$CUR != $$LAST ]; then echo BATTLE_API_URL=$$CUR > /app/src/core/services/mini_app_fighting/.env; echo API_URL=$$CUR > /app/src/core/services/mini_app_fishing/.env; echo env updated: $$CUR; LAST=$$CUR; fi; fi; sleep 5; done"
    depends_on:
      - frontend-api

  pinggy-frontend:
    image: alpine:latest
    restart: unless-stopped
    volumes:
      - .:/app
    command: >
      sh -c "apk add --no-cache openssh-client grep &&  ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 80:frontend_fishing:5173 free.pinggy.io 2>&1 |  tee /dev/stderr |  grep --line-buffered -Eo 'https://[a-zA-Z0-9.-]+\.free\.pinggy\.net' > /app/frontend_url.txt"
    depends_on:
      - frontend_fishing
      - api
      # cloudflared-frontend-gladiators:
      #   image: cloudflare/cloudflared:latest
      #   restart: unless-stopped
      #   command: tunnel --no-autoupdate --url http://frontend_gladiators:5173
      #   depends_on:
      #     - frontend_gladiators
